<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录游戏账号</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f15;
            background-image: radial-gradient(circle at 25% 0%, #1a2a2f 0%, #0a0e12 100%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #e3edf2;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        .login-card {
            max-width: 500px;
            width: 100%;
            background: rgba(10, 18, 24, 0.75);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(68, 148, 148, 0.25);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(50, 200, 200, 0.1) inset;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .login-card h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4e9d6, #8ed3b2, #6ab0a6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        .login-card .subtitle {
            color: #8db5aa;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #d6f2e5;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #162b28;
            border: 1px solid #4dac94;
            border-radius: 1rem;
            color: #e3edf2;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #7fffd4;
            box-shadow: 0 0 0 3px rgba(127, 255, 212, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: #2f6a5e;
            border: none;
            border-radius: 1rem;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background: #3e8f7c;
            transform: scale(1.01);
        }

        .login-result {
            margin-top: 1.2rem;
            font-weight: 600;
            min-height: 2rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #688d84;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #7fffd4;
            text-decoration: underline;
        }

        .success-box {
            display: none;
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(63, 185, 80, 0.15);
            border: 1px solid #3fb950;
            border-radius: 1.5rem;
        }

        .success-box h2 {
            color: #7fffd4;
            margin-bottom: 0.5rem;
        }

        .success-box p {
            color: #d6f2e5;
        }

        .logout-btn {
            margin-top: 1rem;
            padding: 0.5rem 2rem;
            background: #5e2f2f;
            border: none;
            border-radius: 2rem;
            color: #ff7b72;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #7a3b3b;
        }

        .watermark {
            position: fixed;
            bottom: 12px;
            right: 20px;
            font-size: 0.85rem;
            color: #6f9e93;
            background: rgba(10, 25, 22, 0.7);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #39807660;
            letter-spacing: 0.3px;
            z-index: 999;
            pointer-events: none;
            font-weight: 400;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="watermark">mcjava.cc</div>

    <div class="login-card">
        <h1>登录账号</h1>
        <p class="subtitle">使用你在 Minecraft 服务器注册的账号密码</p>

        <!-- 登录表单 -->
        <div id="login-form">
            <div class="form-group">
                <label>玩家名称</label>
                <input type="text" id="login-name" placeholder="例如: example">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="login-pwd" placeholder="你的游戏密码">
            </div>
            <button class="login-btn" onclick="handleLogin()">登录</button>
            <div id="login-result" class="login-result"></div>
        </div>

        <!-- 登录成功 -->
        <div id="success-box" class="success-box">
            <h2>登录成功</h2>
            <p>欢迎回来，<span id="welcome-name" style="color: #f0f9d0; font-weight: bold;"></span></p>
            <button class="logout-btn" onclick="handleLogout()">登出</button>
        </div>

        <a href="/" class="back-link">← 返回主页</a>
    </div>

    <script>
        // 云函数数据接口
        const ACCOUNTS_JSON_URL = "https://sync.mcjava.cc/verify";

        // SHA-256 哈希函数
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 处理登录
        async function handleLogin() {
            const name = document.getElementById('login-name').value.trim();
            const pwd = document.getElementById('login-pwd').value.trim();
            const resultBox = document.getElementById('login-result');

            if (!name || !pwd) {
                resultBox.innerHTML = '<span style="color: #ff7b72;">请填写玩家名和密码</span>';
                return;
            }

            resultBox.innerHTML = '<span style="color: #8db5aa;">验证中...</span>';

            // 计算哈希
            const inputHash = await sha256(pwd);

            // 发送到云函数验证
            try {
                const res = await fetch(ACCOUNTS_JSON_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: name, password: inputHash })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('login-form').style.display = 'none';
                    document.getElementById('success-box').style.display = 'block';
                    document.getElementById('welcome-name').innerText = name;
                } else {
                    resultBox.innerHTML = '<span style="color: #ff7b72;">玩家名或密码错误</span>';
                }
            } catch (e) {
                resultBox.innerHTML = '<span style="color: #ff7b72;">无法连接服务器</span>';
            }
        }

        // 登出
        function handleLogout() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('success-box').style.display = 'none';
            document.getElementById('login-result').innerHTML = '';
            document.getElementById('login-name').value = '';
            document.getElementById('login-pwd').value = '';
        }
    </script>
</body>
</html>
